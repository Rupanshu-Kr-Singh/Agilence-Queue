openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: queue
    description: Clinic queue operations
  - name: auth
    description: Sign-in and clinic role operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentClinicUser
      tags: [auth]
      summary: Get the signed-in clinic user's role and profile
      responses:
        "200":
          description: Signed-in clinic member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentClinicUserResponse"
        "401":
          description: Sign-in required
        "403":
          description: Account is not assigned to this clinic
  /auth/members:
    get:
      operationId: listClinicMembers
      tags: [auth]
      summary: List clinic users (clinic owner only)
      responses:
        "200":
          description: Clinic staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicMembersResponse"
        "403":
          description: Clinic owner role required
    post:
      operationId: addClinicMember
      tags: [auth]
      summary: Grant clinic access to a staff email (clinic owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClinicMemberInput"
      responses:
        "201":
          description: Staff access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicMemberResponse"
        "400":
          description: Invalid staff details
        "403":
          description: Clinic owner role required
        "409":
          description: Email already has clinic access
  /queue/today:
    get:
      operationId: getTodayQueue
      tags: [queue]
      summary: Get today's clinic queue and dashboard totals
      responses:
        "200":
          description: Today's queue snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueSnapshot"
  /queue:
    post:
      operationId: addQueueEntry
      tags: [queue]
      summary: Add a patient to today's queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueEntryInput"
      responses:
        "201":
          description: Patient added to the queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueEntry"
        "400":
          description: Invalid patient details
  /queue/call-next:
    post:
      operationId: callNextPatient
      tags: [queue]
      summary: Call the next waiting patient
      responses:
        "200":
          description: Patient called
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueEntry"
        "404":
          description: No patients are waiting
        "409":
          description: A patient is already with the doctor
  /queue/{entryId}/complete:
    post:
      operationId: completeQueueEntry
      tags: [queue]
      summary: Complete the current consultation
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Consultation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueEntry"
        "404":
          description: Queue entry not found
        "409":
          description: Queue entry is not currently with the doctor
  /queue/{entryId}/cancel:
    post:
      operationId: cancelQueueEntry
      tags: [queue]
      summary: Cancel or skip a queue entry
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Queue entry cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueEntry"
        "404":
          description: Queue entry not found
        "409":
          description: Queue entry can no longer be cancelled
  /queue/events:
    get:
      operationId: subscribeQueueEvents
      tags: [queue]
      summary: Subscribe to live queue updates
      description: Server-sent events stream. Emits a queue-updated event after each queue change.
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AppRole:
      type: string
      enum: [admin, assistant, doctor]
    CurrentClinicUser:
      type: object
      required: [id, displayName, email, role, clinicId, clinicName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/AppRole"
        clinicId:
          type: string
          format: uuid
        clinicName:
          type: string
    CurrentClinicUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/CurrentClinicUser"
    ClinicMember:
      type: object
      required: [id, displayName, email, role, isActive, hasAccount]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/AppRole"
        isActive:
          type: boolean
        hasAccount:
          type: boolean
    ClinicMembersResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/ClinicMember"
    AddClinicMemberInput:
      type: object
      required: [displayName, email, role]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        role:
          type: string
          enum: [assistant, doctor]
    ClinicMemberResponse:
      type: object
      required: [member]
      properties:
        member:
          $ref: "#/components/schemas/ClinicMember"
    QueueStatus:
      type: string
      enum: [waiting, with_doctor, completed, cancelled]
    QueueEntry:
      type: object
      required:
        - id
        - patientId
        - queueNumber
        - name
        - issueDescription
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        queueNumber:
          type: integer
        name:
          type: string
        phone:
          type: ["string", "null"]
        issueDescription:
          type: string
        status:
          $ref: "#/components/schemas/QueueStatus"
        doctorId:
          type: ["string", "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        calledAt:
          type: ["string", "null"]
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
    QueueSnapshot:
      type: object
      required:
        - clinicName
        - serviceDate
        - waitingCount
        - completedToday
        - averageWaitMinutes
        - entries
      properties:
        clinicName:
          type: string
        serviceDate:
          type: string
          format: date
        waitingCount:
          type: integer
        completedToday:
          type: integer
        averageWaitMinutes:
          type: ["number", "null"]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/QueueEntry"
    QueueEntryInput:
      type: object
      required: [name, issueDescription]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          maxLength: 30
        issueDescription:
          type: string
          minLength: 1
          maxLength: 240

